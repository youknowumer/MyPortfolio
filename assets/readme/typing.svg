<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-label="Rotating roles: Frontend Developer, Business Intelligence Enthusiast, Odoo ERP, SAP and Power BI">
<title>Rotating roles: Frontend Developer, Business Intelligence Enthusiast, Odoo ERP, SAP and Power BI</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'SF Mono','JetBrains Mono',Consolas,Menlo,'Courier New',monospace}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}

@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,10px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-8px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,14px)}}
.o1{animation:d1 14s ease-in-out infinite}.o2{animation:d2 17s ease-in-out infinite}.o3{animation:d3 19s ease-in-out infinite}

.sweep{animation:sw 7s cubic-bezier(.5,0,.2,1) infinite}
@keyframes sw{0%{transform:skewX(-18deg) translateX(0)}50%,100%{transform:skewX(-18deg) translateX(1500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
